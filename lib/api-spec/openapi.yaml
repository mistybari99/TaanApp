openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: ISLAMIYA Revolving Fund API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginInput" } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      responses:
        "200": { description: Setup state, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingStatus" } } } }
  /onboarding/initialize:
    post:
      operationId: initializeFund
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingInput" } } }
      responses:
        "201": { description: First owner created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200": { description: Owner dashboard, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /cycles:
    get:
      operationId: listCycles
      responses:
        "200": { description: Fund cycles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FundCycle" } } } } }
    post:
      operationId: createCycle
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FundCycleInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FundCycle" } } } }
  /cycles/{id}:
    patch:
      operationId: updateCycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FundCycleUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FundCycle" } } } }
  /cycles/{id}/tan:
    get:
      operationId: getTan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: TAN configuration and schedule, content: { application/json: { schema: { $ref: "#/components/schemas/TanResponse" } } } }
  /cycles/{id}/tan/lock:
    post:
      operationId: lockTan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TanLockInput" } } }
      responses:
        "201": { description: TAN locked, content: { application/json: { schema: { $ref: "#/components/schemas/TanLockResult" } } } }
  /cycles/{id}/tan/pause:
    post:
      operationId: pauseTan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/TanScheduleActionInput" } } }
      responses:
        "200": { description: TAN paused, content: { application/json: { schema: { $ref: "#/components/schemas/TanScheduleActionResult" } } } }
  /cycles/{id}/tan/resume:
    post:
      operationId: resumeTan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/TanScheduleActionInput" } } }
      responses:
        "200": { description: TAN resumed, content: { application/json: { schema: { $ref: "#/components/schemas/TanScheduleActionResult" } } } }
  /cycles/{id}/members:
    get:
      operationId: listCycleMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cycle members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CycleMember" } } } } }
    post:
      operationId: upsertCycleMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CycleMemberInput" } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/CycleMember" } } } }
  /due-entries:
    post:
      operationId: createDueEntry
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DueEntryInput" } } }
      responses:
        "201": { description: Previous due recorded }
  /due-entries/batch:
    post:
      operationId: createDueEntries
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BatchDueEntryInput" } } }
      responses:
        "201": { description: Previous due recorded for all selected members, content: { application/json: { schema: { $ref: "#/components/schemas/BatchDueEntryResult" } } } }
  /share-transfers/preview:
    get:
      operationId: previewShareTransfer
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: integer } }
        - { name: fromMemberId, in: query, required: true, schema: { type: integer } }
        - { name: quantity, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Transfer preview, content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransferPreview" } } } }
  /share-transfers:
    get:
      operationId: listShareTransfers
      parameters:
        - { name: cycleId, in: query, schema: { type: integer } }
        - { name: memberId, in: query, schema: { type: integer } }
      responses:
        "200": { description: Share transfers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShareTransfer" } } } } }
    post:
      operationId: createShareTransfer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransferInput" } } }
      responses:
        "201": { description: Transfer created, content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransfer" } } } }
  /share-transfers/{id}/settlement:
    post:
      operationId: createTransferSettlement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransferSettlementInput" } } }
      responses:
        "201": { description: Settlement approved, content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransfer" } } } }
  /members:
    get:
      operationId: listMembers
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
    post:
      operationId: createMember
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
  /members/import:
    post:
      operationId: importMembers
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberImportInput" } } }
      responses:
        "200": { description: Import preview or result, content: { application/json: { schema: { $ref: "#/components/schemas/MemberImportResult" } } } }
  /members/{id}:
    patch:
      operationId: updateMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
  /members/{id}/history:
    get:
      operationId: getMemberHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Member history, content: { application/json: { schema: { $ref: "#/components/schemas/MemberHistory" } } } }
  /payments:
    get:
      operationId: listPayments
      responses:
        "200": { description: Payments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Payment" } } } } }
    post:
      operationId: createPayment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentInput" } } }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "409": { description: Duplicate warning }
  /payments/{id}/reverse:
    post:
      operationId: reversePayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReversalInput" } } }
      responses:
        "200": { description: Reversed, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
  /settlements:
    get:
      operationId: listSettlements
      responses:
        "200": { description: Settlements, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Settlement" } } } } }
    post:
      operationId: createSettlement
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SettlementInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Settlement" } } } }
  /cash-handovers:
    get:
      operationId: listCashHandovers
      responses:
        "200": { description: Cash custody handovers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CashHandover" } } } } }
    post:
      operationId: createCashHandover
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CashHandoverInput" } } }
      responses:
        "201": { description: Handover submitted, content: { application/json: { schema: { $ref: "#/components/schemas/CashHandover" } } } }
  /cash-handover-recipients:
    get:
      operationId: listCashHandoverRecipients
      responses:
        "200": { description: Active custody receivers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
  /cash-custody/balances:
    get:
      operationId: listCashCustodyBalances
      responses:
        "200": { description: Current cash custody balances, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CashCustodyBalance" } } } } }
  /collector-targets:
    get:
      operationId: listCollectorTargets
      responses:
        "200": { description: Weekly collector handover targets and progress, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CollectorTarget" } } } } }
    post:
      operationId: upsertCollectorTarget
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectorTargetInput" } } }
      responses:
        "200": { description: Target saved, content: { application/json: { schema: { $ref: "#/components/schemas/CollectorTarget" } } } }
  /cash-handovers/{id}/accept:
    post:
      operationId: acceptCashHandover
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CashHandoverDecisionInput" } } }
      responses:
        "200": { description: Handover accepted, content: { application/json: { schema: { $ref: "#/components/schemas/CashHandover" } } } }
  /cash-handovers/{id}/reject:
    post:
      operationId: rejectCashHandover
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CashHandoverDecisionInput" } } }
      responses:
        "200": { description: Handover rejected, content: { application/json: { schema: { $ref: "#/components/schemas/CashHandover" } } } }
  /draws:
    get:
      operationId: listDraws
      parameters:
        - { name: cycleId, in: query, schema: { type: integer } }
        - { name: memberId, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string } }
        - { name: drawNumber, in: query, schema: { type: integer } }
      responses:
        "200": { description: Friday draws, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Draw" } } } } }
    post:
      operationId: createDraw
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DrawInput" } } }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Draw" } } } }
  /draws/{id}/disbursement:
    post:
      operationId: createDrawDisbursement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DrawDisbursementInput" } } }
      responses:
        "201": { description: Draw payout recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Draw" } } } }
  /draws/{id}/move-date:
    post:
      operationId: moveDrawDate
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DrawDateMoveInput" } } }
      responses:
        "200": { description: Draw date moved, content: { application/json: { schema: { $ref: "#/components/schemas/DrawDateMoveResult" } } } }
  /draw-disbursements/{id}/reverse:
    post:
      operationId: reverseDrawDisbursement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReversalInput" } } }
      responses:
        "200": { description: Draw payout reversed, content: { application/json: { schema: { $ref: "#/components/schemas/Draw" } } } }
  /collectors:
    get:
      operationId: listCollectors
      responses:
        "200": { description: Collectors, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
    post:
      operationId: createCollector
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectorInput" } } }
      responses:
        "201": { description: Collector created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /collectors/{id}:
    patch:
      operationId: updateCollector
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectorUpdate" } } }
      responses:
        "200": { description: Collector updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /cash-receivers:
    get:
      operationId: listCashReceivers
      responses:
        "200": { description: Cash receivers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
    post:
      operationId: createCashReceiver
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiverInput" } } }
      responses:
        "201": { description: Cash receiver created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /cash-receivers/{id}:
    patch:
      operationId: updateCashReceiver
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiverUpdate" } } }
      responses:
        "200": { description: Cash receiver updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /permissions:
    get:
      operationId: listPermissions
      responses:
        "200": { description: Delegated permissions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PermissionRecord" } } } } }
    post:
      operationId: grantPermission
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermissionInput" } } }
      responses:
        "201": { description: Permission granted, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionRecord" } } } }
  /permissions/{id}/revoke:
    post:
      operationId: revokePermission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PermissionRevocationInput" } } }
      responses:
        "200": { description: Permission revoked, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionRecord" } } } }
  /audit:
    get:
      operationId: listAudit
      responses:
        "200": { description: Audit, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SettingsInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
  /reports/export:
    get:
      operationId: exportReport
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [members, payments, collectors, settlements, draws, audit, daily, weekly, monthly, due, collector] } }
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status, database, serverTime]
      properties:
        status: { type: string }
        database: { type: string }
        serverTime: { type: string }
    LoginInput:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string } }
    User:
      type: object
      required: [id, name, username, role]
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [OWNER, COLLECTOR, CASH_RECEIVER] }
        active: { type: boolean }
    PermissionRecord:
      type: object
      required: [id, userId, userName, username, role, permission, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        username: { type: string }
        role: { type: string, enum: [COLLECTOR, CASH_RECEIVER] }
        permission: { type: string, enum: [FULL_ACCESS, PAYMENT_REVERSAL, PAYOUT_APPROVAL, PAYOUT_REVERSAL, ADVANCE_ALLOCATION, FINANCIAL_CORRECTION, DRAW_DATE_CORRECTION] }
        cycleId: { type: integer, nullable: true }
        expiresAt: { type: string, nullable: true }
        revokedAt: { type: string, nullable: true }
        note: { type: string }
        createdAt: { type: string }
        grantedByName: { type: string, nullable: true }
    PermissionInput:
      type: object
      required: [userId, permission]
      properties:
        userId: { type: integer, minimum: 1 }
        permission: { type: string, enum: [FULL_ACCESS, PAYMENT_REVERSAL, PAYOUT_APPROVAL, PAYOUT_REVERSAL, ADVANCE_ALLOCATION, FINANCIAL_CORRECTION, DRAW_DATE_CORRECTION] }
        cycleId: { type: integer, minimum: 1, nullable: true }
        expiresAt: { type: string, nullable: true }
        note: { type: string }
    PermissionRevocationInput:
      type: object
      properties:
        reason: { type: string }
    OnboardingStatus:
      type: object
      required: [initialized, demoMode]
      properties:
        initialized: { type: boolean }
        demoMode: { type: boolean }
    OnboardingInput:
      type: object
      required: [organizationName, ownerName, username, password]
      properties:
        organizationName: { type: string, minLength: 2 }
        ownerName: { type: string, minLength: 2 }
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    CollectorInput:
      type: object
      required: [name, username, password]
      properties:
        name: { type: string, minLength: 2 }
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    CollectorUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        active: { type: boolean }
        password: { type: string, minLength: 8 }
    CashReceiverInput:
      type: object
      required: [name, username, password]
      properties:
        name: { type: string, minLength: 2 }
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    CashReceiverUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        active: { type: boolean }
        password: { type: string, minLength: 8 }
    Member:
      type: object
      required: [id, memberId, name, shares, dailyAmount, joiningDate, status, todayPaid, todayDue]
      properties:
        id: { type: integer }
        memberId: { type: string }
        name: { type: string }
        mobile: { type: string, nullable: true }
        businessName: { type: string }
        nid: { type: string, nullable: true }
        address: { type: string }
        shares: { type: integer }
        dailyAmount: { type: number }
        joiningDate: { type: string }
        status: { type: string, enum: [active, inactive] }
        todayPaid: { type: number }
        todayDue: { type: number }
        currentPeriodDue: { type: number }
        previousDue: { type: number }
        advanceCredit: { type: number }
        totalDue: { type: number }
        createdAt: { type: string }
        notes: { type: string }
    MemberUpdate:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        businessName: { type: string }
        nid: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, inactive] }
        notes: { type: string }
    FundCycle:
      type: object
      required: [id, cycleNumber, name, startDate, dailyPerShare, drawFrequency, drawDay, status, memberCount]
      properties:
        id: { type: integer }
        cycleNumber: { type: integer }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string, nullable: true }
        trackingStartDate: { type: string, nullable: true }
        dailyPerShare: { type: number }
        drawFrequency: { type: string, enum: [WEEKLY] }
        drawDay: { type: string, enum: [FRIDAY] }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        notes: { type: string }
        createdAt: { type: string }
        memberCount: { type: integer }
    FundCycleInput:
      type: object
      required: [name, startDate]
      properties:
        cycleNumber: { type: integer }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        trackingStartDate: { type: string }
        dailyPerShare: { type: number, default: 100 }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        notes: { type: string }
    FundCycleUpdate:
      type: object
      properties:
        name: { type: string }
        endDate: { type: string }

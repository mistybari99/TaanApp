openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: ISLAMIYA Revolving Fund API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginInput" } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      responses:
        "200": { description: Setup state, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingStatus" } } } }
  /onboarding/initialize:
    post:
      operationId: initializeFund
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingInput" } } }
      responses:
        "201": { description: First owner created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200": { description: Owner dashboard, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /cycles:
    get:
      operationId: listCycles
      responses:
        "200": { description: Fund cycles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FundCycle" } } } } }
    post:
      operationId: createCycle
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FundCycleInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FundCycle" } } } }
  /cycles/{id}:
    patch:
      operationId: updateCycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FundCycleUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FundCycle" } } } }
  /cycles/{id}/tan:
    get:
      operationId: getTan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: TAN configuration and schedule, content: { application/json: { schema: { $ref: "#/components/schemas/TanResponse" } } } }
  /cycles/{id}/tan/lock:
    post:
      operationId: lockTan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TanLockInput" } } }
      responses:
        "201": { description: TAN locked, content: { application/json: { schema: { $ref: "#/components/schemas/TanLockResult" } } } }
  /cycles/{id}/members:
    get:
      operationId: listCycleMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cycle members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CycleMember" } } } } }
    post:
      operationId: upsertCycleMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CycleMemberInput" } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/CycleMember" } } } }
  /due-entries:
    post:
      operationId: createDueEntry
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DueEntryInput" } } }
      responses:
        "201": { description: Previous due recorded }
  /share-transfers/preview:
    get:
      operationId: previewShareTransfer
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: integer } }
        - { name: fromMemberId, in: query, required: true, schema: { type: integer } }
        - { name: quantity, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Transfer preview, content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransferPreview" } } } }
  /share-transfers:
    get:
      operationId: listShareTransfers
      parameters:
        - { name: cycleId, in: query, schema: { type: integer } }
        - { name: memberId, in: query, schema: { type: integer } }
      responses:
        "200": { description: Share transfers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShareTransfer" } } } } }
    post:
      operationId: createShareTransfer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransferInput" } } }
      responses:
        "201": { description: Transfer created, content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransfer" } } } }
  /share-transfers/{id}/settlement:
    post:
      operationId: createTransferSettlement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransferSettlementInput" } } }
      responses:
        "201": { description: Settlement approved, content: { application/json: { schema: { $ref: "#/components/schemas/ShareTransfer" } } } }
  /members:
    get:
      operationId: listMembers
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
    post:
      operationId: createMember
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
  /members/import:
    post:
      operationId: importMembers
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberImportInput" } } }
      responses:
        "200": { description: Import preview or result, content: { application/json: { schema: { $ref: "#/components/schemas/MemberImportResult" } } } }
  /members/{id}:
    patch:
      operationId: updateMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
  /members/{id}/history:
    get:
      operationId: getMemberHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Member history, content: { application/json: { schema: { $ref: "#/components/schemas/MemberHistory" } } } }
  /payments:
    get:
      operationId: listPayments
      responses:
        "200": { description: Payments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Payment" } } } } }
    post:
      operationId: createPayment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentInput" } } }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "409": { description: Duplicate warning }
  /payments/{id}/reverse:
    post:
      operationId: reversePayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReversalInput" } } }
      responses:
        "200": { description: Reversed, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
  /settlements:
    get:
      operationId: listSettlements
      responses:
        "200": { description: Settlements, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Settlement" } } } } }
    post:
      operationId: createSettlement
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SettlementInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Settlement" } } } }
  /draws:
    get:
      operationId: listDraws
      parameters:
        - { name: cycleId, in: query, schema: { type: integer } }
        - { name: memberId, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string } }
        - { name: drawNumber, in: query, schema: { type: integer } }
      responses:
        "200": { description: Friday draws, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Draw" } } } } }
    post:
      operationId: createDraw
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DrawInput" } } }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Draw" } } } }
  /collectors:
    get:
      operationId: listCollectors
      responses:
        "200": { description: Collectors, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
    post:
      operationId: createCollector
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectorInput" } } }
      responses:
        "201": { description: Collector created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /collectors/{id}:
    patch:
      operationId: updateCollector
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectorUpdate" } } }
      responses:
        "200": { description: Collector updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /audit:
    get:
      operationId: listAudit
      responses:
        "200": { description: Audit, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SettingsInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
  /reports/export:
    get:
      operationId: exportReport
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [members, payments, collectors, settlements, audit, daily, weekly, monthly, due, collector] } }
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status, database, serverTime]
      properties:
        status: { type: string }
        database: { type: string }
        serverTime: { type: string }
    LoginInput:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string } }
    User:
      type: object
      required: [id, name, username, role]
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [OWNER, COLLECTOR] }
        active: { type: boolean }
    OnboardingStatus:
      type: object
      required: [initialized, demoMode]
      properties:
        initialized: { type: boolean }
        demoMode: { type: boolean }
    OnboardingInput:
      type: object
      required: [organizationName, ownerName, username, password]
      properties:
        organizationName: { type: string, minLength: 2 }
        ownerName: { type: string, minLength: 2 }
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    CollectorInput:
      type: object
      required: [name, username, password]
      properties:
        name: { type: string, minLength: 2 }
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    CollectorUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        active: { type: boolean }
        password: { type: string, minLength: 8 }
    Member:
      type: object
      required: [id, memberId, name, mobile, shares, dailyAmount, joiningDate, status, todayPaid, todayDue]
      properties:
        id: { type: integer }
        memberId: { type: string }
        name: { type: string }
        mobile: { type: string }
        nid: { type: string, nullable: true }
        address: { type: string }
        shares: { type: integer }
        dailyAmount: { type: number }
        joiningDate: { type: string }
        status: { type: string, enum: [active, inactive] }
        todayPaid: { type: number }
        todayDue: { type: number }
        previousDue: { type: number }
        totalDue: { type: number }
        createdAt: { type: string }
        notes: { type: string }
    MemberUpdate:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        nid: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, inactive] }
        notes: { type: string }
    FundCycle:
      type: object
      required: [id, cycleNumber, name, startDate, dailyPerShare, drawFrequency, drawDay, status, memberCount]
      properties:
        id: { type: integer }
        cycleNumber: { type: integer }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string, nullable: true }
        trackingStartDate: { type: string, nullable: true }
        dailyPerShare: { type: number }
        drawFrequency: { type: string, enum: [WEEKLY] }
        drawDay: { type: string, enum: [FRIDAY] }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        notes: { type: string }
        createdAt: { type: string }
        memberCount: { type: integer }
    FundCycleInput:
      type: object
      required: [name, startDate]
      properties:
        cycleNumber: { type: integer }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        trackingStartDate: { type: string }
        dailyPerShare: { type: number, default: 100 }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        notes: { type: string }
    FundCycleUpdate:
      type: object
      properties:
        name: { type: string }
        endDate: { type: string }
        trackingStartDate: { type: string }
        dailyPerShare: { type: number }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        notes: { type: string }
    CycleMember:
      type: object
      required: [id, cycleId, memberId, memberCode, name, shares, dailyContribution, totalCollected, todayDue]
      properties:
        id: { type: integer }
        cycleId: { type: integer }
        memberId: { type: integer }
        memberCode: { type: string }
        name: { type: string }
        mobile: { type: string }
        status: { type: string }
        shares: { type: integer }
        dailyContribution: { type: number }
        totalCollected: { type: number }
        todayDue: { type: number }
        previousDue: { type: number }
        totalDue: { type: number }
    CycleMemberInput:
      type: object
      required: [memberId, shares]
      properties:
        memberId: { type: integer }
        shares: { type: integer, minimum: 1 }
        effectiveDate: { type: string }
        reason: { type: string, minLength: 1 }
    DueEntryInput:
      type: object
      required: [cycleId, memberId, amount, dueDate, reason]
      properties:
        cycleId: { type: integer }
        memberId: { type: integer }
        amount: { type: number, exclusiveMinimum: 0 }
        dueDate: { type: string }
        reason: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 8 }
    ShareTransferPreview:
      type: object
      required: [cycleId, fromMemberId, currentShares, transferableShares, requestedShares, remainingShares, accumulatedContribution, transferredContribution, isWinner]
      properties:
        cycleId: { type: integer }
        fromMemberId: { type: integer }
        fromMemberCode: { type: string }
        fromMemberName: { type: string }
        currentShares: { type: integer }
        transferableShares: { type: integer }
        requestedShares: { type: integer }
        remainingShares: { type: integer }
        accumulatedContribution: { type: number }
        transferredContribution: { type: number }
        isWinner: { type: boolean }
    ShareTransfer:
      type: object
      required: [id, transferId, cycleId, cycleNumber, cycleName, transferDate, fromMemberId, fromMemberCode, fromMemberName, toMemberId, toMemberCode, toMemberName, shares, accumulatedValue, notes, overrideWinner, createdBy, createdByName, createdAt]
      properties:
        id: { type: integer }
        transferId: { type: string }
        cycleId: { type: integer }
        cycleNumber: { type: integer }
        cycleName: { type: string }
        transferDate: { type: string }
        fromMemberId: { type: integer }
        fromMemberCode: { type: string }
        fromMemberName: { type: string }
        toMemberId: { type: integer }
        toMemberCode: { type: string }
        toMemberName: { type: string }
        shares: { type: integer }
        accumulatedValue: { type: number }
        notes: { type: string }
        overrideWinner: { type: boolean }
        createdBy: { type: integer }
        createdByName: { type: string }
        createdAt: { type: string }
        settlementId: { type: integer, nullable: true }
        settlementAmount: { type: number, nullable: true }
        settlementStatus: { type: string, nullable: true }
        settlementApprovedBy: { type: integer, nullable: true }
        settlementApprovedByName: { type: string, nullable: true }
        settlementApprovedAt: { type: string, nullable: true }
        settlementNotes: { type: string, nullable: true }
    ShareTransferInput:
      type: object
      required: [cycleId, fromMemberId, toMemberId, quantity]
      properties:
        cycleId: { type: integer }
        fromMemberId: { type: integer }
        toMemberId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        transferDate: { type: string }
        notes: { type: string }
        overrideWinner: { type: boolean }
        overrideConfirmation: { type: boolean }
        settlementAmount: { type: number, minimum: 0 }
        settlementNotes: { type: string }
        idempotencyKey: { type: string, minLength: 8 }
    TransferSettlementInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 0 }
        notes: { type: string }
        idempotencyKey: { type: string, minLength: 8 }
    Draw:
      type: object
      required: [id, cycleId, cycleNumber, drawNumber, drawDate, winnerMemberId, winnerMemberCode, winnerName, winningAmount, status]
      properties:
        id: { type: integer }
        cycleId: { type: integer }
        cycleNumber: { type: integer }
        cycleName: { type: string }
        drawNumber: { type: integer }
        drawDate: { type: string }
        winnerMemberId: { type: integer }
        winnerMemberCode: { type: string }
        winnerName: { type: string }
        winningAmount: { type: number }
        status: { type: string }
        notes: { type: string }
        createdAt: { type: string }
        tanPeriodId: { type: integer, nullable: true }
        drawSlot: { type: integer, nullable: true }
    DrawInput:
      type: object
      required: [cycleId, drawDate, winnerMemberId, winningAmount]
      properties:
        cycleId: { type: integer }
        drawDate: { type: string }
        winnerMemberId: { type: integer }
        winningAmount: { type: number }
        status: { type: string }
        notes: { type: string }
        idempotencyKey: { type: string, minLength: 8 }
        tanPeriodId: { type: integer }
        drawSlot: { type: integer, minimum: 1 }
    TanLockInput:
      type: object
      required: [tanStartDate, drawsPerWeek]
      properties:
        tanStartDate: { type: string }
        drawsPerWeek: { type: integer, minimum: 1 }
    TanPeriod:
      type: object
      required: [id, sequenceNo, periodStart, periodEnd, drawDate, expectedCollection, status, computedStatus, recordedDraws]
      properties:
        id: { type: integer }
        sequenceNo: { type: integer }
        periodStart: { type: string }
        periodEnd: { type: string }
        drawDate: { type: string }
        expectedCollection: { type: number }
        status: { type: string, enum: [OPEN, COMPLETED] }
        computedStatus: { type: string, enum: [SCHEDULED, OPEN, CLOSED, COMPLETED] }
        recordedDraws: { type: integer }
        completedAt: { type: string, nullable: true }
    TanConfig:
      type: object
      required: [id, cycleId, tanStartDate, drawsPerWeek, totalShares, totalDrawDates, dailyPerShare, expectedDailyCollection, weeklyCollectionUnit, perDrawWinnerAmount, status]
      properties:
        id: { type: integer }
        cycleId: { type: integer }
        tanStartDate: { type: string }
        drawsPerWeek: { type: integer }
        totalShares: { type: integer }
        totalDrawDates: { type: integer }
        dailyPerShare: { type: number }
        expectedDailyCollection: { type: number }
        weeklyCollectionUnit: { type: number }
        perDrawWinnerAmount: { type: number }
        status: { type: string, enum: [LOCKED, COMPLETED] }
        lockedAt: { type: string }
        completedAt: { type: string, nullable: true }
    TanResponse:
      type: object
      required: [tan, periods, activePeriod, nextPeriod]
      properties:
        tan: { allOf: [{ $ref: "#/components/schemas/TanConfig" }], nullable: true }
        periods: { type: array, items: { $ref: "#/components/schemas/TanPeriod" } }
        activePeriod: { allOf: [{ $ref: "#/components/schemas/TanPeriod" }], nullable: true }
        nextPeriod: { allOf: [{ $ref: "#/components/schemas/TanPeriod" }], nullable: true }
    TanLockResult:
      type: object
      required: [id, cycleId, totalShares, drawsPerWeek, totalDrawDates, perDrawWinnerAmount, tanStartDate]
      properties:
        id: { type: integer }
        cycleId: { type: integer }
        totalShares: { type: integer }
        drawsPerWeek: { type: integer }
        totalDrawDates: { type: integer }
        perDrawWinnerAmount: { type: number }
        tanStartDate: { type: string }
    MemberHistory:
      type: object
      required: [member, cycles, payments, draws, transfers]
      properties:
        member: { $ref: "#/components/schemas/Member" }
        cycles: { type: array, items: { $ref: "#/components/schemas/MemberCycleSummary" } }
        payments: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        draws: { type: array, items: { $ref: "#/components/schemas/MemberDrawHistory" } }
        transfers: { type: array, items: { $ref: "#/components/schemas/ShareTransfer" } }
    MemberCycleSummary:
      type: object
      required: [cycleId, cycleNumber, name, startDate, status, shares, dailyContribution, totalCollected]
      properties:
        cycleId: { type: integer }
        cycleNumber: { type: integer }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string, nullable: true }
        status: { type: string }
        shares: { type: integer }
        dailyContribution: { type: number }
        totalCollected: { type: number }
        previousDue: { type: number }
        totalDue: { type: number }
    MemberDrawHistory:
      type: object
      required: [id, cycleId, cycleNumber, drawNumber, drawDate, winningAmount, status]
      properties:
        id: { type: integer }
        cycleId: { type: integer }
        cycleNumber: { type: integer }
        drawNumber: { type: integer }
        drawDate: { type: string }
        winningAmount: { type: number }
        status: { type: string }
        notes: { type: string }
    MemberInput:
      type: object
      required: [memberId, name, mobile, shares, dailyAmount, joiningDate, status]
      properties:
        memberId: { type: string }
        name: { type: string }
        mobile: { type: string }
